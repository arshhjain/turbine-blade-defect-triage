# Wind Turbine Blade Defect Classification MVP Configuration
project:
  name: "wind_turbine_blade_defect_mvp"
  version: "1.0.0"
  random_seed: 42
  device: "cuda"  # "cuda" or "cpu"

dataset:
  # Supported classes: cracking, erosion, delamination, normal (optional baseline)
  classes:
    - "cracking"
    - "erosion"
    - "delamination"
  figshare_dir: "data/figshare/WT blade defect dataset"
  roboflow_dir: "data/roboflow"
  val_split: 0.2
  test_split: 0.1
  num_workers: 0

augmentation:
  # Heavy Albumentations configuration
  heavy: true
  rotation_limit: 45
  rotation_prob: 0.7
  flip_prob: 0.5
  color_jitter_prob: 0.6
  brightness_limit: 0.25
  contrast_limit: 0.25
  blur_prob: 0.4
  blur_limit: [3, 7]
  weather_wear_prob: 0.5
  gaussian_noise_var: [10.0, 50.0]
  coarse_dropout_prob: 0.4

model:
  backbone: "resnet50"  # resnet34, resnet50, convnext_tiny, efficientnet_b0
  pretrained: true
  use_cbam_attention: true
  use_multi_scale: true
  multi_scale_channels: 256
  dropout: 0.3
  pooling: "avg_max_cat"  # concatenated adaptive avg + max pool

progressive_training:
  enabled: true
  # Progressive resolution stages (low-res coarse shapes -> high-res hairline details)
  stages:
    - name: "stage_low_res"
      resolution: 224
      epochs: 3
      batch_size: 16
      lr: 0.0003
      weight_decay: 0.0001
      freeze_backbone_epochs: 1
    - name: "stage_mid_res"
      resolution: 384
      epochs: 3
      batch_size: 8
      lr: 0.0001
      weight_decay: 0.0001
      freeze_backbone_epochs: 0
    - name: "stage_high_res"
      resolution: 512
      epochs: 4
      batch_size: 4
      lr: 0.00003
      weight_decay: 0.00005
      freeze_backbone_epochs: 0

training:
  loss_type: "focal"  # "focal" or "cross_entropy"
  focal_gamma: 2.0
  label_smoothing: 0.05
  optimizer: "adamw"
  scheduler: "cosine"
  min_lr: 0.000001
  save_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"

semi_supervised:
  # Guided by yuuStella's semi-supervised PyTorch architecture
  enabled: false
  unlabeled_data_dir: "data/unlabeled"
  confidence_threshold: 0.90
  unlabeled_loss_weight: 1.0

evaluation:
  metric: "f1_macro"
  outputs_dir: "outputs/evaluations"
  save_confusion_matrix: true

inference:
  checkpoint_path: "outputs/checkpoints/best_model_progressive.pth"
  gradcam_target_layer: "feature_aggregator"
  output_dir: "outputs/diagnostics"
  severity_matrix:
    cracking:
      base_severity: 4  # Scale 1-5: 4 is severe structural risk
      description: "Surface or structural fracture along blade substrate/gel coat"
      action: "High priority: Dispatch rope-access physical NDT inspection within 48-72h. Limit operating pitch angles in high gusts."
    delamination:
      base_severity: 4  # Scale 1-5: 4 is severe composite separation
      description: "Subsurface composite laminate separation/skin disbonding"
      action: "Critical priority: Risk of blade shell collapse under aerodynamic loads. Immediate thermographic/ultrasonic scanning required."
    erosion:
      base_severity: 2  # Scale 1-5: 2-3 is aerodynamic efficiency degradation & wear
      description: "Leading-edge erosion/pitting from airborne droplet/particulate impact"
      action: "Moderate priority: Monitor aerodynamic drag impact. Schedule leading edge protection (LEP) tape/coating repair at next service window."
    normal:
      base_severity: 0
      description: "Intact, aerodynamic composite surface with healthy gel coat"
      action: "Routine: Keep in standard scheduled drone inspection cycle."
