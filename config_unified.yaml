# Unified Configuration for Wind Turbine Blade Defect & Severity Prediction
# Solo Deep Learning (Semester V) Evaluation - 23 November 2026

project:
  name: "wind_turbine_blade_damage_detection"
  candidate: "Arsh Jain"
  version: "2.0.0"
  random_seed: 42
  device: "cuda"

dataset:
  origin: "Figshare: Multiclass Dataset for Intelligent Detection of Wind Turbine Blade Defects"
  manifest_path: "data/splits/leak_free_split_manifest.json"
  images_dir: "data/figshare/WT blade defect dataset/JPEGImages"
  annotations_dir: "data/figshare/WT blade defect dataset/Annotations"
  classes:
    - "crack"
    - "craze_crack"
    - "delamination"
    - "erosion"
    - "lightning_damage"
    - "surface_damage"
  num_classes: 6
  severity_scale: [1, 2, 3, 4, 5]

split_statistics:
  leak_prevention: "GroupShuffleSplit on 361 contiguous drone sequence clusters"
  train_samples: 747
  val_samples: 159
  test_samples: 159
  total_samples: 1065
  group_overlap: 0.0

model:
  backbone: "resnet50"
  pretrained: true
  use_cbam: true
  cbam_reduction_ratio: 16
  cbam_spatial_kernel: 7
  dropout: 0.3
  pooling: "concat_adaptive_avg_max"
  fused_feature_dim: 4096
  bottleneck_dim: 512

multi_task_heads:
  type_head:
    num_classes: 6
    loss_type: "class_weighted_focal_loss"
    focal_gamma: 2.0
  severity_continuous_head:
    loss_type: "smooth_l1_loss"
    loss_weight: 0.5
    scale_min: 1.0
    scale_max: 5.0
  severity_ordinal_head:
    num_thresholds: 4
    loss_type: "frank_hall_binary_cross_entropy"
    loss_weight: 0.5

training:
  epochs: 12
  batch_size: 16
  image_size: 224
  optimizer: "adamw"
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: "cosine_annealing"
  min_lr: 0.000001
  grad_clip_norm: 1.0

inference:
  checkpoint: "outputs/proposed_multitask_cbam/checkpoints/best.pth"
  output_predictions_dir: "outputs/predictions"
  sample_test_images:
    # all from the TEST split (see RESULTS_VERIFIED.md)
    crack: "data/figshare/WT blade defect dataset/JPEGImages/4.jpg"
    erosion: "data/figshare/WT blade defect dataset/JPEGImages/3.jpg"
    lightning: "data/figshare/WT blade defect dataset/JPEGImages/10.jpg"
    failure_case: "data/figshare/WT blade defect dataset/JPEGImages/754.jpg"
